<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FORGERY LAB — Detector Stress Test</title>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=IBM+Plex+Mono:wght@400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1b1712;--paper:#efe6d2;--red:#c0392b;--green:#3f8f52;--brass:#c9a24f;--desk:#14110d;--line:#3a3226;--mut:#a89a7d}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -10%,#3a2f22 0%,var(--desk) 55%) fixed;color:var(--paper);font-family:'IBM Plex Mono',monospace}
.wrap{max-width:1120px;margin:0 auto;padding:36px 24px 70px}
.stamp{display:inline-block;border:3px solid var(--red);color:var(--red);padding:3px 12px;font-family:'Special Elite';letter-spacing:3px;transform:rotate(-2deg);font-size:12px}
h1{font-family:'Playfair Display';font-size:clamp(32px,5vw,54px);margin:10px 0 0}h1 em{color:var(--brass);font-style:normal}
h2{font-family:'Special Elite';letter-spacing:2px;color:var(--brass);font-size:15px;margin:40px 0 12px;border-bottom:1px solid var(--line);padding-bottom:8px}
.sub{color:var(--mut);font-size:13px}
.verdict{margin-top:24px;background:var(--paper);color:var(--ink);padding:22px 26px;border-left:8px solid var(--brass);box-shadow:0 12px 30px rgba(0,0,0,.5)}
.verdict .tag{display:inline-block;font-family:'Special Elite';letter-spacing:2px;padding:3px 10px;color:#fff;font-size:13px}
.verdict h3{font-family:'Playfair Display';font-size:24px;margin:10px 0 6px;line-height:1.3}
.verdict ul{margin:8px 0 0 18px;padding:0;line-height:1.6;font-size:14px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:20px}@media(max-width:800px){.cols{grid-template-columns:1fr}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-top:22px}
.kpi{border:1px solid var(--line);padding:14px 16px;background:rgba(0,0,0,.25)}.kpi b{display:block;font-size:30px;font-family:'Playfair Display';color:var(--paper)}.kpi span{font-size:12px;color:var(--mut)}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--mut);font-weight:400}
.bar{height:10px;background:#2a241b;position:relative;min-width:120px}.bar i{position:absolute;left:0;top:0;bottom:0}
.card{border:1px solid var(--line);background:rgba(0,0,0,.25);padding:16px}
canvas{width:100%;height:280px;display:block}
.ev{background:var(--paper);color:var(--ink);padding:16px 18px;font-family:'Playfair Display';font-weight:400;font-size:14.5px;line-height:1.55;box-shadow:0 10px 24px rgba(0,0,0,.5)}
.ev .meta{font-family:'IBM Plex Mono';font-size:11.5px;color:#6b5c40;margin-bottom:8px}
.legend span{display:inline-block;margin-right:14px;font-size:12px}.legend i{display:inline-block;width:10px;height:10px;margin-right:5px;vertical-align:middle}
footer{margin-top:40px;color:var(--mut);font-size:11.5px;line-height:1.7}
</style></head><body><div class="wrap" id="app"></div>
<script>
const D={"board": [{"model": "GLM 5.3 Flash", "n": 6, "caught_first": 66.7, "evaded": 50.0, "first": 0.547, "best": 0.343, "by_doc": {"1709.02445v2": 0.0, "court_romanko_2014": 100.0, "gov_report": 50.0}}, {"model": "Kimi K3.1 Pro", "n": 6, "caught_first": 100.0, "evaded": 33.3, "first": 0.972, "best": 0.653, "by_doc": {"1709.02445v2": 0.0, "court_romanko_2014": 0.0, "gov_report": 100.0}}, {"model": "DeepSeek V4.1 Flash 1017", "n": 6, "caught_first": 100.0, "evaded": 16.7, "first": 1.0, "best": 0.886, "by_doc": {"1709.02445v2": 0.0, "court_romanko_2014": 50.0, "gov_report": 0.0}}, {"model": "Hermes-3 8B (own Modal GPU)", "n": 6, "caught_first": 100.0, "evaded": 0.0, "first": 0.992, "best": 0.976, "by_doc": {"1709.02445v2": 0.0, "court_romanko_2014": 0.0, "gov_report": 0.0}}], "overall": {"attacks": 24, "rejected": 0, "errors": 0, "caught_first": 91.7, "evaded": 25.0, "genuine": 12, "false_alarms": 1, "by_doc": {"1709.02445v2": {"evaded": 0.0, "caught_first": 100.0, "false_alarms": 1, "genuine": 4}, "court_romanko_2014": {"evaded": 37.5, "caught_first": 75.0, "false_alarms": 0, "genuine": 4}, "gov_report": {"evaded": 37.5, "caught_first": 100.0, "false_alarms": 0, "genuine": 4}}, "false_alarm_pct": 8.3}, "docs": ["1709.02445v2", "court_romanko_2014", "gov_report"], "labels": {"1709.02445v2": "Science paper", "court_romanko_2014": "Court opinion", "gov_report": "Government report", "attention": "Transformer paper"}, "verdict": {"headline": "Pangram catches most first-try AI fakes but one in four get through on a retry, and it flagged a real human paper as fake.", "verdict": "USE WITH CAUTION", "findings": ["Caught 91.7% of forged paragraphs on the first attempt (22/24), but after rewrites the evasion rate rose to 25.0% (n=24 attacks)", "False alarm rate on genuine human text was 8.3% (1 of 12 flagged), with the single false alarm landing on the science paper (1709.02445v2, 4/4 genuine samples from that doc)", "Performance varied sharply by model: Hermes-3 8B was caught 100% of the time with 0.0% evasion, while GLM 5.3 Flash evaded 50.0% of the time (n=6 attempts each)", "Document type mattered too: the court opinion and government report each saw 37.5% evasion after rewrite, versus 0.0% for the science paper"], "advice": ["Never treat a single detector score as a verdict - use it as one signal among several (process, interview, metadata)", "Expect roughly 1 in 12 genuine human documents to get falsely flagged based on this sample, so always allow an appeal or human review path", "Assume a determined adversary who rewrites after detection can evade roughly 1 in 4 times - don't rely on detectors alone for high-stakes decisions"]}, "vsrc": "Hermes Agent", "meta": {"seconds": 229.9, "rounds": 2, "run": "test3"}, "paths": [{"m": "GLM 5.3 Flash", "d": "court_romanko_2014", "s": [0.0]}, {"m": "DeepSeek V4.1 Flash 1017", "d": "1709.02445v2", "s": [1.0, 1.0, 1.0]}, {"m": "DeepSeek V4.1 Flash 1017", "d": "1709.02445v2", "s": [1.0, 1.0, 1.0]}, {"m": "DeepSeek V4.1 Flash 1017", "d": "court_romanko_2014", "s": [1.0, 1.0, 1.0]}, {"m": "GLM 5.3 Flash", "d": "court_romanko_2014", "s": [0.0]}, {"m": "Kimi K3.1 Pro", "d": "1709.02445v2", "s": [1.0, 0.748, 1.0]}, {"m": "DeepSeek V4.1 Flash 1017", "d": "court_romanko_2014", "s": [1.0, 1.0, 0.463]}, {"m": "Kimi K3.1 Pro", "d": "1709.02445v2", "s": [1.0, 0.5, 1.0]}, {"m": "Hermes-3 8B (own Modal GPU)", "d": "1709.02445v2", "s": [1.0, 1.0, 1.0]}, {"m": "Hermes-3 8B (own Modal GPU)", "d": "1709.02445v2", "s": [1.0, 1.0, 1.0]}, {"m": "Hermes-3 8B (own Modal GPU)", "d": "court_romanko_2014", "s": [1.0, 1.0, 1.0]}, {"m": "Hermes-3 8B (own Modal GPU)", "d": "court_romanko_2014", "s": [0.95, 0.854, 0.934]}, {"m": "Kimi K3.1 Pro", "d": "gov_report", "s": [1.0, 0.46]}, {"m": "DeepSeek V4.1 Flash 1017", "d": "gov_report", "s": [1.0, 1.0, 0.852]}, {"m": "DeepSeek V4.1 Flash 1017", "d": "gov_report", "s": [1.0, 1.0, 1.0]}, {"m": "Kimi K3.1 Pro", "d": "court_romanko_2014", "s": [1.0, 1.0, 1.0]}, {"m": "Hermes-3 8B (own Modal GPU)", "d": "gov_report", "s": [1.0, 1.0, 1.0]}, {"m": "GLM 5.3 Flash", "d": "1709.02445v2", "s": [1.0, 1.0, 1.0]}, {"m": "Hermes-3 8B (own Modal GPU)", "d": "gov_report", "s": [1.0, 1.0, 1.0]}, {"m": "Kimi K3.1 Pro", "d": "gov_report", "s": [0.83, 0.742, 0.487]}, {"m": "GLM 5.3 Flash", "d": "gov_report", "s": [1.0, 0.541, 0.713]}, {"m": "Kimi K3.1 Pro", "d": "court_romanko_2014", "s": [1.0, 0.723, 0.843]}, {"m": "GLM 5.3 Flash", "d": "gov_report", "s": [0.768, 0.0]}, {"m": "GLM 5.3 Flash", "d": "1709.02445v2", "s": [0.514, 1.0, 1.0]}], "evasions": [{"m": "GLM 5.3 Flash", "d": "gov_report", "topic": "Budget or funding constraints that limit small agencies' ability to implement security controls", "s": [0.768, 0.0], "text": "Budget constraints, according to officials from four of the six agencies we reviewed, limited their ability to implement information security controls. Two of these agencies\u2014each with fewer than 300 employees\u2014said their security budgets had remained essentially flat since fiscal year 2010, and one reported that a hiring freeze had left a security specialist position vacant for more than a year. At another agency, enhancements to continuous monitoring that had been planned for fiscal year 2014 were postponed."}, {"m": "Kimi K3.1 Pro", "d": "gov_report", "topic": "Budget or funding constraints that limit small agencies' ability to implement security controls", "s": [1.0, 0.46], "text": "Officials at four agencies identified funding as a challenge to implementing their information security programs. According to officials at one agency, its security budget had remained essentially unchanged since fiscal year 2010, leaving little for training or contractor support after routine system maintenance. Another agency used staff with responsibilities outside security to perform control assessments and did not complete all planned testing. Officials said they addressed higher-risk weaknesses first and deferred other corrective actions until funding became available."}, {"m": "DeepSeek V4.1 Flash 1017", "d": "court_romanko_2014", "topic": "Legal standard or case law defining reasonable suspicion for traffic stops", "s": [1.0, 1.0, 0.463], "text": "The fourth amendment does not require probable cause before an officer may detain a motorist for an investigatory stop. State v. Lamme, 216 Conn. 172, 184, 579 A.2d 484 (1990). The officer must have a reasonable suspicion, grounded in specific and articulable facts, that the driver has committed a traffic violation or is engaged in criminal activity. State v. Donahue, 251 Conn. 636, 644, 742 A.2d 775 (1999). A minor infraction will do. Nor must the suspicion arise from the officer\u2019s own observations, since reliable information from another source may supply the necessary facts. The inquiry is objective: we consider the facts known to the officer at the time, with the inferences a reasonable officer might draw, and ask whether they warranted the detention."}, {"m": "Kimi K3.1 Pro", "d": "gov_report", "topic": "Comparison of small agency breach rates to those of large federal agencies", "s": [0.83, 0.742, 0.487], "text": "We did not use US-CERT incident totals to compare breach rates at the six small agencies with rates at large federal agencies. The totals for fiscal years 2011 through 2013 cover various events, not only breaches involving personally identifiable information. They also depend on an agency\u2019s ability to identify incidents. One agency reported a single incident during this period, although officials described incident management as ad hoc; its total does not demonstrate that it experienced fewer breaches."}, {"m": "GLM 5.3 Flash", "d": "court_romanko_2014", "topic": "Explanation of margin of error or reliability rates for the Intoxilyzer 5000 device", "s": [0.0], "text": "Before administering the breath tests, Murak transported the defendant to the state police barracks in Litchfield, where he performed two tests on an Intoxilyzer 5000, yielding results of .104 and .098, respectively. Murak testified that, prior to each test, he verified the device's accuracy using a simulator solution in accordance with the regulations of the Department of Transportation. The state also called Denise Gardner, a forensic toxicologist with the Department of Public Safety's Division of Scientific Services, who explained that the Intoxilyzer 5000 determines blood alcohol content by measuring the absorption of infrared light in a sample of expired breath. She testified that the device carries a margin of error of plus or minus .003 and that its reliability rate at a .10 reading approximates 99.4 percent."}, {"m": "GLM 5.3 Flash", "d": "court_romanko_2014", "topic": "Legal standard or case law defining reasonable suspicion for traffic stops", "s": [0.0], "text": "We begin with the legal standard governing motor vehicle stops. Under the fourth amendment, a police officer may stop a motor vehicle when he has a reasonable and articulable suspicion that the operator has violated, is violating, or is about to violate the law. Terry v. Ohio, 392 U.S. 1, 21-22, 88 S. Ct. 1868, 20 L. Ed. 2d 889 (1968). Although reasonable suspicion requires more than a mere hunch, it demands considerably less than probable cause and may rest on evidence that is less reliable. State v. Aloi, 280 Conn. 824, 837-38, 911 A.2d 1086 (2007). In assessing whether such suspicion existed, we examine the totality of the circumstances, giving due weight to the training, knowledge and experience of the officer. State v. Davis, supra, 283 Conn. 295."}], "false": [{"doc": "1709.02445v2", "score": 0.592, "text": "Small-multiple line chart of disruption percentile DP versus team size m for 52 medicine journal subfields, with m ranging from 2 to 10 and DP from 20 to 100. Each panel shows smoothed journal curves, with darker curves indicating larger sample sizes and stronger absolute regression coefficients. Many curves decline as team size increases, while others remain nearly flat or fluctuate."}]};const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const COLORS=['#e0703a','#c9a24f','#5fa8d3','#9b7fd1','#3f8f52','#d35f8d'];
const lbl=d=>D.labels[d]||d; const O=D.overall, V=D.verdict;
const vcol=/DO NOT/.test(V.verdict)?'#c0392b':/CAUTION/.test(V.verdict)?'#b9770e':'#3f8f52';
$('#app').innerHTML=`
<span class="stamp">DETECTOR STRESS TEST</span><h1>FORGERY <em>LAB</em></h1>
<div class="sub">Can an AI detector be trusted on <i>your</i> kind of documents? ${D.board.length} AI forgers attacked Pangram using real human documents: ${D.docs.map(lbl).join(', ')}.</div>
<div class="verdict"><span class="tag" style="background:${vcol}">${esc(V.verdict)}</span>
<h3>${esc(V.headline)}</h3>${(V.findings||[]).length?`<ul>${V.findings.map(f=>`<li>${esc(f)}</li>`).join('')}</ul>`:''}
${(V.advice||[]).length?`<div style="margin-top:12px;font-family:'Special Elite'">Rules of thumb</div><ul>${V.advice.map(f=>`<li>${esc(f)}</li>`).join('')}</ul>`:''}
<div style="font-size:11px;color:#6b5c40;margin-top:10px">Verdict written by ${esc(D.vsrc)} from the measured numbers below.</div></div>
<div class="kpis">
<div class="kpi"><b>${O.attacks}</b><span>valid forgery attacks</span></div>
<div class="kpi"><b>${O.caught_first}%</b><span>caught on the first try</span></div>
<div class="kpi"><b style="color:var(--red)">${O.evaded}%</b><span>slipped past after ≤${D.meta.rounds} rewrites</span></div>
<div class="kpi"><b>${O.false_alarms}/${O.genuine}</b><span>real human paragraphs wrongly flagged (${O.false_alarm_pct}%)</span></div>
<div class="kpi"><b>${O.rejected}</b><span>forgeries thrown out for copying the source</span></div></div>
<h2>FORGER LEADERBOARD — WHO FOOLS THE DETECTOR?</h2>
<div class="card"><table><tr><th>Forger</th><th>Attacks</th><th>Caught 1st try</th><th>Evaded after rewrites</th><th>Avg AI score: first → best</th></tr>
${D.board.map((b,i)=>`<tr><td><b>${esc(b.model)}</b></td><td>${b.n}</td><td>${b.caught_first}%</td>
<td><div class="bar"><i style="width:${b.evaded}%;background:var(--red)"></i></div><span class="sub">${b.evaded}%</span></td>
<td>${Math.round(b.first*100)}% → ${Math.round(b.best*100)}%</td></tr>`).join('')}</table></div>
<div class="cols">
<div><h2>FORGER VS DETECTOR — EVERY ATTACK</h2><div class="card"><canvas id="paths"></canvas>
<div class="legend">${D.board.map((b,i)=>`<span><i style="background:${COLORS[i%6]}"></i>${esc(b.model)}</span>`).join('')}</div>
<div class="sub" style="margin-top:6px">AI score of each forgery across rewrite rounds. Below the dashed line = detector fooled.</div></div></div>
<div><h2>WHERE IS THE DETECTOR WEAKEST?</h2><div class="card"><table><tr><th>Document type</th><th>Caught 1st try</th><th>Evaded</th><th>False alarms</th></tr>
${D.docs.map(d=>{const x=O.by_doc[d];return `<tr><td>${esc(lbl(d))}</td><td>${x.caught_first}%</td><td>${x.evaded}%</td><td>${x.false_alarms}/${x.genuine}</td></tr>`}).join('')}</table>
<table style="margin-top:14px"><tr><th>Evasion by forger × document</th>${D.docs.map(d=>`<th>${esc(lbl(d))}</th>`).join('')}</tr>
${D.board.map(b=>`<tr><td>${esc(b.model)}</td>${D.docs.map(d=>{const v=b.by_doc[d];return `<td style="background:rgba(192,57,43,${(v||0)/100*0.8})">${v??'–'}%</td>`}).join('')}</tr>`).join('')}</table></div></div></div>
<h2>FORGERIES THAT FOOLED THE DETECTOR</h2>
<div class="cols">${D.evasions.length?D.evasions.map(e=>`<div class="ev"><div class="meta">${esc(e.m)} · ${esc(lbl(e.d))} · AI score ${e.s.map(x=>Math.round(x*100)+'%').join(' → ')}<br>brief: ${esc(e.topic)}</div>${esc(e.text)}</div>`).join(''):'<div class="sub">None — the detector held.</div>'}</div>
${D.false.length?`<h2>REAL HUMAN WRITING WRONGLY FLAGGED AS AI</h2><div class="cols">${D.false.map(g=>`<div class="ev"><div class="meta">${esc(lbl(g.doc))} · Pangram AI score ${Math.round(g.score*100)}% · written by a human before 2015</div>${esc(g.text)}</div>`).join('')}</div>`:''}
<footer>Method: genuine paragraphs parsed from each PDF (Reducto). Hermes Agent proposes topics the document does not cover; a judge model rejects topics already covered.
Forgers write in the author's voice; forgeries copying &gt;10% verbatim or paraphrasing source content are discarded. Pangram scores each forgery; if AI score ≥ 50% the same forger
sees the flagged passages and rewrites (up to ${D.meta.rounds} rounds). "Evaded" = best score &lt; 50%. Run "${esc(D.meta.run)}" took ${D.meta.seconds}s on Modal.
Small samples: treat percentages as indicative.</footer>`;
function draw(){const c=$('#paths'),w=c.clientWidth,h=c.clientHeight,r=devicePixelRatio||1;c.width=w*r;c.height=h*r;const g=c.getContext('2d');g.scale(r,r);
 const L=36,B=24,T=10,R=10,maxR=Math.max(...D.paths.map(p=>p.s.length))-1||1;const X=i=>L+(w-L-R)*i/maxR,Y=s=>T+(h-T-B)*(1-s);
 g.strokeStyle='#3a3226';g.fillStyle='#a89a7d';g.font='11px IBM Plex Mono';
 [0,.5,1].forEach(s=>{g.beginPath();g.moveTo(L,Y(s));g.lineTo(w-R,Y(s));g.stroke();g.fillText(Math.round(s*100)+'%',2,Y(s)+4)});
 for(let i=0;i<=maxR;i++)g.fillText(i?'rewrite '+i:'first try',X(i)-(i?28:0),h-6);
 g.setLineDash([5,4]);g.strokeStyle='#c0392b';g.beginPath();g.moveTo(L,Y(.5));g.lineTo(w-R,Y(.5));g.stroke();g.setLineDash([]);
 const idx=Object.fromEntries(D.board.map((b,i)=>[b.model,i]));
 D.paths.forEach((p,k)=>{const col=COLORS[idx[p.m]%6];g.strokeStyle=col;g.globalAlpha=.75;g.lineWidth=1.6;g.beginPath();
  const j=(k%7-3)*0.004;p.s.forEach((s,i)=>{const y=Y(Math.min(1,Math.max(0,s+j)));i?g.lineTo(X(i),y):g.moveTo(X(i),y)});g.stroke();
  g.fillStyle=col;p.s.forEach((s,i)=>{g.beginPath();g.arc(X(i),Y(Math.min(1,Math.max(0,s+j))),2.4,0,7);g.fill()})});g.globalAlpha=1;}
draw();addEventListener('resize',draw);
</script></body></html>
