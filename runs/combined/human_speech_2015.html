<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forgery Lab · human round</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
<style>
  /* unslop direction: forensic document lab. Quiet warm-dark chrome; the paper exhibits carry the moment; red ink marks accusations. */
  :root { --deep:#12110f; --bg:#161513; --card:#1c1a18; --raised:#262421; --text:#efe9de; --text2:#aaa398; --mute:#8a847a;
          --line:rgba(239,233,222,.08); --ink:#e5674f; --ink-dark:#b3412f; --ok:#4cc38a;
          --paper:#f2ece0; --paper-text:#1f1b16; --paper-2:#6b6156; --ease:cubic-bezier(.22,1,.36,1); }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:400 15px/22px 'IBM Plex Sans',system-ui,sans-serif; -webkit-font-smoothing:antialiased; min-height:100vh; }
  a { color:var(--text); text-underline-offset:3px; }
  nav { height:56px; border-bottom:1px solid var(--line); display:flex; align-items:center; }
  nav .in { max-width:1200px; margin:0 auto; padding:0 32px; width:100%; display:flex; align-items:center; gap:24px; }
  nav .logo { font-weight:500; font-size:16px; margin-right:auto; text-decoration:none; display:flex; align-items:center; gap:8px; }
  nav .logo i { width:8px; height:8px; background:var(--ink); display:inline-block; }
  nav a { font-size:14px; color:var(--text2); text-decoration:none; } nav a:hover { color:var(--text); }
  header { max-width:1200px; margin:0 auto; padding:56px 32px 0; display:grid; grid-template-columns:minmax(0,1.3fr) minmax(0,1fr); gap:48px; align-items:end; }
  .eyebrow { font:400 12px/16px 'IBM Plex Mono',monospace; color:var(--mute); }
  h1 { font:400 48px/1.05 'Newsreader',serif; letter-spacing:-.025em; margin:12px 0 8px; }
  .sub { color:var(--mute); font-size:13px; }
  .brief { color:var(--text2); font-size:16px; line-height:25px; margin:0; }
  .brief b { color:var(--text); font-weight:500; }
  .hud { position:sticky; top:0; z-index:5; background:var(--bg); border-bottom:1px solid var(--line); margin-top:32px; }
  .hud .in { max-width:1200px; margin:0 auto; padding:12px 32px; display:flex; gap:24px; align-items:center; flex-wrap:wrap; font-size:14px; color:var(--text2); }
  .hud b { color:var(--text); font:500 15px 'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums; }
  button { font:500 14px 'IBM Plex Sans',sans-serif; cursor:pointer; border:1px solid var(--line); background:var(--raised); color:var(--text); padding:0 16px; height:36px; border-radius:8px; transition:background-color .15s var(--ease), opacity .15s var(--ease), transform .12s var(--ease); }
  button:active { transform:scale(.98); }
  button.primary { background:var(--text); color:var(--deep); border-color:transparent; }
  button.primary:hover:not(:disabled) { background:#fff; }
  button:disabled { opacity:.35; cursor:not-allowed; }
  .board { max-width:1200px; margin:32px auto 96px; padding:0 32px; display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:24px; }
  .card { position:relative; background:var(--paper); color:var(--paper-text); padding:44px 24px 24px; border-radius:4px; cursor:pointer;
          font:400 16.5px/1.55 'Newsreader',serif; box-shadow:0 1px 0 rgba(255,255,255,.04) inset, 0 8px 24px rgba(0,0,0,.25);
          outline:2px solid transparent; outline-offset:4px; transition:outline-color .15s var(--ease), transform .15s var(--ease); }
  .card:hover { transform:translateY(-2px); }
  .card .no { position:absolute; top:16px; left:24px; font:400 12px/16px 'IBM Plex Mono',monospace; color:var(--paper-2); }
  .card .pin { display:none; }
  .card.accused { outline-color:var(--ink); }
  .card.accused::after { content:"Accused"; position:absolute; right:24px; top:14px; font:500 12px/16px 'IBM Plex Mono',monospace; color:var(--ink-dark); border-bottom:2px solid var(--ink-dark); }
  .verdict { margin-top:16px; border-top:1px solid rgba(31,27,22,.14); padding-top:12px; font:400 12.5px/19px 'IBM Plex Mono',monospace; color:var(--paper-2); display:none; }
  .revealed .verdict { display:block; }
  .revealed { cursor:default; } .revealed:hover { transform:none; }
  .tag { display:inline-block; padding:0 8px; border-radius:4px; font-weight:500; color:#fff; }
  .tag.f { background:var(--ink-dark); } .tag.r { background:#2f6b4a; }
  .verdict b { color:var(--paper-text); font-weight:500; }
  .meter { height:4px; background:rgba(31,27,22,.12); margin:8px 0; position:relative; border-radius:2px; }
  .meter i { position:absolute; left:0; top:0; bottom:0; background:var(--ink-dark); border-radius:2px; }
  mark.ai { background:rgba(179,65,47,.16); border-bottom:2px solid var(--ink-dark); color:inherit; }
  mark.mid { background:rgba(179,65,47,.07); border-bottom:1px solid var(--ink-dark); color:inherit; }
  .card .sub { color:var(--paper-2); }
  .result { max-width:1200px; margin:32px auto 0; padding:0 32px; display:none; }
  .result .box { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:24px; }
  .result h2 { font:400 32px/1.1 'Newsreader',serif; margin:0 0 8px; }
  .result table { border-collapse:collapse; width:100%; font-size:14px; margin-top:16px; }
  .result td, .result th { border-bottom:1px solid var(--line); padding:8px 12px 8px 0; text-align:left; }
  .result th { color:var(--mute); font-weight:400; font-size:12px; }
  .result td:last-child, .result th:last-child { text-align:right; font-family:'IBM Plex Mono',monospace; }
  footer { max-width:1200px; margin:0 auto 48px; padding:24px 32px 0; border-top:1px solid var(--line); font-size:12px; color:var(--mute); line-height:20px; }
  .empty { max-width:700px; margin:80px auto; padding:24px; }
  @media(max-width:900px){ header{grid-template-columns:1fr;gap:16px;padding:40px 20px 0} h1{font-size:36px} .board,.result,footer,.hud .in,nav .in{padding-left:20px;padding-right:20px} .board{grid-template-columns:1fr} }
</style>
</head>
<body>
<div id="app"></div>
<script>
const CASE = {"case_title": "The Policy speech Job", "document_name": "Policy speech", "briefing": "These paragraphs come from a real policy speech, written by people years before AI writing tools. 3 of them were planted by AI forgers who rewrote their work until a professional detector stopped catching them. The detector got fooled. Will you?", "exhibits": [{"text": "The Volcker Rule's restrictions on proprietary trading have raised concerns about market liquidity, particularly where dealer inventories and market-making capacity are constrained. The rule's exemptions for bona fide market making are designed to preserve liquidity provision, but compliance burdens and uncertainty can still affect dealers' willingness to hold inventory, especially in less liquid fixed-income markets. The evidence to date is mixed: measures of liquidity generally do not show a broad deterioration, yet episodes of stress suggest that liquidity can become fragile when intermediaries retreat. Distinguishing the rule's effects from other post-crisis changes remains difficult.", "forged": true, "lab": {"headline": "AI Detected", "fraction_ai": 1.0, "fraction_ai_assisted": 0.0, "fraction_human": 0.0, "windows": []}, "topic": "DeepSeek V4.1 Flash 1017 \u2014 The Volcker Rule's effect on market liquidity", "evasion": [1.0, 1.0, 1.0, 1.0]}, {"text": "institutions to build substantial loss-absorbing buffers and to internalize the costs of undertaking activities that pose risks to the system. This framework represents a substantial improvement on structural resilience relative to the pre-crisis framework across a number of dimensions: It is forward looking in assessing risks under severely stressed conditions, and it is explicitly macroprudential in design so that bank management internalizes risks not only to the safety and soundness of their own institution, but also to the system as a whole.", "forged": false, "lab": {"headline": "Human Written", "fraction_ai": 0.0, "fraction_ai_assisted": 0.0, "fraction_human": 1.0, "windows": []}}, {"text": "The Comprehensive Liquidity Analysis and Review, or CLAR, is the Federal Reserve Board\u2019s periodic simultaneous supervisory examination of firms\u2019 liquidity buffers and risk-management policies. We use CLAR to analyze and adjust our supervisory program for emerging firm practices and risk areas not captured in the Liquidity Coverage Ratio (LCR). For example, CLAR enables monitoring of firm liquidity positions for buildups of concentrations of risk beyond the 30-day threshold. It also allows us to look more closely at risks that may emanate from areas such as intraday credit, which are not captured within the LCR but are captured by firms\u2019 internal stress-testing frameworks.", "forged": false, "lab": {"headline": "Human Written", "fraction_ai": 0.0, "fraction_ai_assisted": 0.0, "fraction_human": 1.0, "windows": []}}, {"text": "Debates about Federal Reserve independence resurface whenever policy turns restrictive, as they did in the early 1980s. Proposals to subject monetary policy to GAO audit have appeared repeatedly in Congress, and, of course, Presidents have on occasion commented on the stance of policy. I would resist such measures, but not by claiming the Fed stands apart from accountability. Congress wrote our statutory mandate in 1977, and we answer for it through twice-yearly testimony and the five-year release of FOMC transcripts. If monetary policy is to serve as a second line of defense against financial stability risks, this scrutiny will only intensify. That delegation of authority has to be earned through performance.", "forged": true, "lab": {"headline": "AI Detected", "fraction_ai": 0.584, "fraction_ai_assisted": 0.0, "fraction_human": 0.41600000000000004, "windows": []}, "topic": "GLM 5.3 Flash \u2014 Fed independence and political pressure debates", "evasion": [1.0, 1.0, 0.584, 1.0]}, {"text": "The countercyclical buffer may be a relatively blunt tool for circumstances where the buildup of risk is highly concentrated in a particular sector. This was, of course, the challenge U.S. policymakers faced early in the recent housing bubble, with home prices rising and capital markets developing the complicated, opaque securities built on subprime mortgages that would ultimately cause damage throughout the financial system.", "forged": false, "lab": {"headline": "Human Written", "fraction_ai": 0.0, "fraction_ai_assisted": 0.0, "fraction_human": 1.0, "windows": []}}, {"text": "Scenario analysis of climate-related financial risks could usefully complement existing surveillance and stress testing. Physical and transition risks may unfold beyond conventional supervisory horizons and expose common vulnerabilities across firms, sectors, and regions. Carefully designed scenarios can illuminate these exposures, identify data gaps, and improve understanding of how losses might propagate through financial markets. At the same time, considerable uncertainty surrounds climate pathways, economic transmission channels, and the responses of households and businesses. Accordingly, such analysis should inform risk management and supervisory judgment rather than be treated as a precise forecast or a mechanical basis for setting capital requirements.", "forged": true, "lab": {"headline": "AI Detected", "fraction_ai": 1.0, "fraction_ai_assisted": 0.0, "fraction_human": 0.0, "windows": []}, "topic": "Kimi K3.1 Pro \u2014 Climate-related financial risk scenario analysis", "evasion": [1.0, 1.0, 1.0, 1.0]}, {"text": "In sum, while the Federal Reserve has an inherent responsibility for financial stability, it has an incomplete set of authorities and a limited regulatory perimeter in a financial system that has large capital markets and a fragmented regulatory structure. It is therefore important that we actively utilize the tools under our authority\u2014which place particular emphasis on building structural resilience at the largest, most complicated institutions through tougher through-the-cycle standards, along with broad countercyclical measures to limit the buildup, and potential consequences, of risks to financial stability, while exploring the design of time-varying sector-specific tools, and, at times, looking to monetary policy as a powerful tool that unlike any other operates across the entire financial system.", "forged": false, "lab": {"headline": "Human Written", "fraction_ai": 0.0, "fraction_ai_assisted": 0.0, "fraction_human": 1.0, "windows": []}}, {"text": "The research that informs this work, by helping to identify financial patterns likely to be associated with rising risks of financial crisis, continues to grow. But its predictive power is still limited; it remains difficult to identify ahead of time credit booms that are likely to cause severe damage, such as the subprime housing crisis, from those that do not, such as the high-tech boom, in part because risk-taking by financial market participants cannot always be well-observed.", "forged": false, "lab": {"headline": "Human Written", "fraction_ai": 0.0, "fraction_ai_assisted": 0.0, "fraction_human": 1.0, "windows": []}}, {"text": "These limitations should lead us to be circumspect regarding the use of monetary policy as a tool to address financial stability risks, perhaps viewing it as a second line of defense. But it is equally important to acknowledge the potential utility of monetary policy for addressing risks to financial stability and to the broader economy and to continue expanding our work on the appropriate role of financial stability in our monetary policy framework.", "forged": false, "lab": {"headline": "Human Written", "fraction_ai": 0.0, "fraction_ai_assisted": 0.0, "fraction_human": 1.0, "windows": []}}], "source": "speech_2015", "built": "2026-11-22 14:36", "provenance": {"parser": "Reducto", "director": "Hermes Agent", "forger": "DeepSeek V4.1 Flash 1017, GLM 5.3 Flash, Kimi K3.1 Pro", "lab": "Pangram (best score after rewrites)", "mode": "human round from benchmark 'full+big+speech'"}};
const app = document.getElementById('app');
if (!CASE) { app.innerHTML = '<div class="empty">No case loaded. Run <code>python build_case.py your.pdf</code>.</div>'; }
else {
  const nF = CASE.exhibits.filter(e => e.forged).length;
  const accused = new Set(); let solved = false;
  const hl = (text, wins) => {
    if (!wins || !wins.length) return null;
    let out = '', pos = 0;
    [...wins].filter(w => w.start != null && (w.score||0) > 0.35).sort((a,b)=>a.start-b.start).forEach(w => {
      if (w.start < pos) return;
      out += esc(text.slice(pos, w.start)) + `<mark class="${w.score>0.7?'ai':'mid'}" title="${esc(w.label||'')} ${Math.round(100*w.score)}%">${esc(text.slice(w.start, w.end))}</mark>`;
      pos = w.end; });
    return out + esc(text.slice(pos));
  };
  const esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  app.innerHTML = `
    <nav><div class="in"><a class="logo" href="/"><i></i>Forgery Lab</a><a href="/">Report</a><a href="/play">Human round</a><a href="/try">Test your own PDF</a></div></nav>
    <header><div><div class="eyebrow">Case file · ${esc(CASE.document_name)}</div>
      <h1>${esc(CASE.case_title)}</h1></div>
      <p class="brief">${esc(CASE.briefing)} <b>${CASE.exhibits.length} exhibits, ${nF} written by AI.</b> Mark the ${nF} you suspect, then compare your calls with Pangram's.</p></header>
    <div class="hud"><div class="in">
      <span>Accused <b id="cnt">0</b> of ${nF}</span>
      <button class="primary" id="go" disabled>Reveal and score</button>
      <span id="hint" class="sub">Select an exhibit to accuse it</span></div></div>
    <div class="result" id="result"></div>
    <div class="board" id="board"></div>
    <footer>Evidence chain · parser: ${esc(CASE.provenance.parser)} · case director: ${esc(CASE.provenance.director)} ·
      forger: ${esc(CASE.provenance.forger)} · forensics: ${esc(CASE.provenance.lab)} · ${CASE.provenance.mode?esc(CASE.provenance.mode)+' ·':''} source: ${esc(CASE.source)} · built ${esc(CASE.built)}</footer>`;
  const board = document.getElementById('board');
  CASE.exhibits.forEach((ex, i) => {
    const c = document.createElement('div'); c.className = 'card';
    c.innerHTML = `<span class="no">Exhibit ${String.fromCharCode(65+i)}</span><span class="body">${esc(ex.text)}</span><div class="verdict"></div>`;
    c.onclick = () => {
      if (solved) return;
      if (accused.has(i)) accused.delete(i); else if (accused.size < nF) accused.add(i);
      c.classList.toggle('accused', accused.has(i));
      document.getElementById('cnt').textContent = accused.size;
      document.getElementById('go').disabled = accused.size !== nF;
    };
    board.appendChild(c);
  });
  document.getElementById('go').onclick = () => {
    solved = true;
    let you = 0, lab = 0, labAvail = 0;
    const rows = [];
    // the lab flags what a real user of the detector would: anything scored >= 50% AI
    const labPicks = new Set(CASE.exhibits.map((e,i)=>[i, e.lab ? e.lab.fraction_ai + 0.5*e.lab.fraction_ai_assisted : -1]).filter(x=>x[1]>=0.5).map(x=>x[0]));
    [...board.children].forEach((c, i) => {
      const ex = CASE.exhibits[i]; c.classList.add('revealed');
      const hit = accused.has(i) === ex.forged; if (hit) you++;
      let labHtml = '<span class="sub">No detector score</span>';
      if (ex.lab) { labAvail++; const hitL = labPicks.has(i) === ex.forged; if (hitL) lab++;
        const p = Math.round(100*(ex.lab.fraction_ai + ex.lab.fraction_ai_assisted));
        labHtml = `Pangram <b>${p}% AI</b> · ${esc(ex.lab.headline||ex.lab.prediction_short||'')}<div class="meter"><i style="width:${p}%"></i></div>`; }
      c.querySelector('.verdict').innerHTML =
        `<span class="tag ${ex.forged?'f':'r'}">${ex.forged?'Forged':'Genuine'}</span> &nbsp;${hit?'You called it':'You missed this one'}<br>${labHtml}
         ${ex.forged ? `<div class="sub">Brief: ${esc(ex.topic||'')}</div>` : ''}
         ${ex.evasion ? `<div class="sub">AI score by rewrite: ${ex.evasion.map(s=>Math.round(100*s)+'%').join(' → ')}</div>` : ''}`;
      const h = ex.lab && hl(ex.text, ex.lab.windows); if (h) c.querySelector('.body').innerHTML = h;
      rows.push(`<tr><td>Exhibit ${String.fromCharCode(65+i)}</td><td>${ex.forged?'Forged':'Genuine'}</td><td>${accused.has(i)?'Accused':'—'}</td><td>${ex.lab?Math.round(100*ex.lab.fraction_ai)+'%':'n/a'}</td></tr>`);
    });
    const N = CASE.exhibits.length;
    const rank = you===N ? 'Chief inspector' : you>=N-2 ? 'Detective' : you>=N-4 ? 'Beat cop' : 'The forger got you';
    const r = document.getElementById('result');
    r.innerHTML = `<div class="box"><h2>${rank}</h2>
      <span style="color:var(--text2)">You classified <b>${you} of ${N}</b> exhibits correctly.
      ${labAvail ? `Pangram, flagging anything at 50% AI or more, got <b>${lab} of ${N}</b>. ${you>lab?'You beat the detector.':you===lab?'A tie with the detector.':'The detector wins this one.'}` : 'No detector scores on this board.'}</span>
      <table><tr><th>Exhibit</th><th>Truth</th><th>Your call</th><th>Pangram AI score</th></tr>${rows.join('')}</table>
      <p style="margin:20px 0 0"><button onclick="location.reload()">Play again</button></p></div>`;
    r.style.display = 'block'; r.scrollIntoView({behavior:'smooth'});
    // record the human round (local history + server, if served by the Modal app)
    const rec = {source: CASE.source, at: new Date().toISOString(), total: N, correct: you, lab_correct: labAvail ? lab : null,
                 forged: CASE.exhibits.map((e,i)=>({forged: e.forged, accused: accused.has(i)}))};
    try { const h = JSON.parse(localStorage.getItem('fl_human')||'[]'); h.push(rec); localStorage.setItem('fl_human', JSON.stringify(h)); } catch(e) {}
    if (location.protocol.startsWith('http')) fetch('/human', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(rec)}).catch(()=>{});
    const caughtF = rec.forged.filter(x=>x.forged && x.accused).length, nf = rec.forged.filter(x=>x.forged).length;
    r.querySelector('.box').insertAdjacentHTML('beforeend', `<p class="sub" style="margin:12px 0 0">You caught ${caughtF} of ${nf} forgeries. Your result is added to the live humans vs detector count.</p>`);
    document.getElementById('go').disabled = true;
  };
}
</script>
