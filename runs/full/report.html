:root{--ink:#1b1712;--paper:#efe6d2;--red:#c0392b;--green:#3f8f52;--brass:#c9a24f;--desk:#14110d;--line:#3a3226;--mut:#a89a7d}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -10%,#3a2f22 0%,var(--desk) 55%) fixed;color:var(--paper);font-family:'IBM Plex Mono',monospace}
.wrap{max-width:1120px;margin:0 auto;padding:36px 24px 70px}
.stamp{display:inline-block;border:3px solid var(--red);color:var(--red);padding:3px 12px;font-family:'Special Elite';letter-spacing:3px;transform:rotate(-2deg);font-size:12px}
h1{font-family:'Playfair Display';font-size:clamp(32px,5vw,54px);margin:10px 0 0}h1 em{color:var(--brass);font-style:normal}
h2{font-family:'Special Elite';letter-spacing:2px;color:var(--brass);font-size:15px;margin:40px 0 12px;border-bottom:1px solid var(--line);padding-bottom:8px}
.sub{color:var(--mut);font-size:13px}
.verdict{margin-top:24px;background:var(--paper);color:var(--ink);padding:22px 26px;border-left:8px solid var(--brass);box-shadow:0 12px 30px rgba(0,0,0,.5)}
.verdict .tag{display:inline-block;font-family:'Special Elite';letter-spacing:2px;padding:3px 10px;color:#fff;font-size:13px}
.verdict h3{font-family:'Playfair Display';font-size:24px;margin:10px 0 6px;line-height:1.3}
.verdict ul{margin:8px 0 0 18px;padding:0;line-height:1.6;font-size:14px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:20px}@media(max-width:800px){.cols{grid-template-columns:1fr}}

.kpi{border:1px solid var(--line);padding:14px 16px;background:rgba(0,0,0,.25)}.kpi b{display:block;font-size:30px;font-family:'Playfair Display';color:var(--paper)}.kpi span{font-size:12px;color:var(--mut)}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--mut);font-weight:400}
.bar{height:10px;background:#2a241b;position:relative;min-width:120px}.bar i{position:absolute;left:0;top:0;bottom:0}
.card{border:1px solid var(--line);background:rgba(0,0,0,.25);padding:16px}
canvas{width:100%;height:280px;display:block}
.ev{background:var(--paper);color:var(--ink);padding:16px 18px;font-family:'Playfair Display';font-weight:400;font-size:14.5px;line-height:1.55;box-shadow:0 10px 24px rgba(0,0,0,.5)}

.legend span{display:inline-block;margin-right:14px;font-size:12px}.legend i{display:inline-block;width:10px;height:10px;margin-right:5px;vertical-align:middle}

he last author as leader and measured career age from that author\u2019s first WOS paper, dividing leaders into 0\u20135, 6\u201315, and >15 year groups. Career age matters. Leaders in the oldest group have larger teams and lower average DP, but DP still decreases with m in all three groups, including comparisons restricted to papers from the same year and journal. Matching small and large teams on leader career age gives the same pattern, as does substituting prior publications for career age. Experienced leadership is associated with less disruptive work, yet it cannot account for the systematic difference between small and large teams."}, {"m": "Kimi K3.1 Pro", "d": "1709.02445v2", "topic": "International collaboration and geographic distribution of team members", "s": [1.0, 0.0], "text": "One possibility is that team size proxies for the geographic reach of collaboration. Author addresses let us test this directly. We call a paper international if its affiliations include at least two countries, then compare papers with the same m. International collaborations are larger and more highly cited, but not more disruptive. Indeed, DP edges downward as additional countries enter the author list. The decline of disruption with m is nevertheless visible among domestic papers and international papers considered separately. Using cities in place of countries, and dropping records whose addresses cannot be resolved, changes little. Widely dispersed teams can still develop rather than disrupt; geographic reach does not account for the team-size effect."}, {"m": "Kimi K3.1 Pro", "d": "1709.02445v2", "topic": "Preprint servers' effect on citation timing", "s": [1.0, 1.0, 0.0], "text": "A further complication is preprint circulation, which can start the citation clock before the publication date in Web of Science. We identified arXiv deposits by title and first-author matches, pooled citations to deposit and journal versions, and moved year zero to the deposit year. The sleeping beauty index was then calculated again. Its distribution barely moves. Nor is there a systematic shift in the relationship between delay and m; dropping matched articles gives the same pattern. Restricting the comparison to fields without a common preprint server leaves these conclusions unchanged. Early attention to a different version can redistribute citations across dates, but it does not account for the delayed recognition observed here."}, {"m": "DeepSeek V4.1 Flash 1017", "d": "court_romanko_2014", "topic": "Expert testimony on the effects of Ativan on motor skills", "s": [1.0, 1.0, 0.0], "text": "A treating physician or pharmacologist could have testified at trial about lorazepam's effects at a therapeutic dose, including whether the drug impairs gait, divided attention, or hand-eye coordination in a manner resembling intoxication. The defendant offered no such witness. After the state objected to his lay testimony, he made no offer of proof and made no attempt to satisfy Conn. Code Evid. \u00a7 7-2. The jury was left with the defendant's own account of Ativan's effect on him that night."}, {"m": "Kimi K3.1 Pro", "d": "court_romanko_2014", "topic": "Chain of custody for the beer cans collected as evidence", "s": [1.0, 0.0], "text": "The defendant challenges the admission of the beer cans on chain of custody grounds. The arresting officer testified that he bagged the cans, marked the bag with the case number and delivered it to the property room. The property officer did not testify. Nor did the defendant offer evidence that the cans had been altered or exchanged. The claimed gap bore on the weight of the evidence, not its admissibility. See State v. Conroy, 194 Conn. 623, 625\u201326, 484 A.2d 448 (1984)."}, {"m": "GLM 5.3 Flash", "d": "court_romanko_2014", "topic": "Cross-examination of Cheryl Byrne's identification testimony", "s": [1.0, 1.0, 0.0], "text": "The defendant next takes issue with the court's handling of his cross-examination of Cheryl Byrne
